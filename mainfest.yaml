apiVersion: v1
kind: Secret
metadata:
  name: mysql
  namespace: roboshop
type: Opaque
data:
  MYSQL_ALLOW_EMPTY_PASSWORD: "eWVzCg=="
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: roboshop
  labels:
    project: roboshop
    tier: db
    component: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      tier: db
      component: mysql
  template:
    metadata:
      labels:
        project: roboshop
        tier: db
        component: mysql
    spec:
    serviceAccountName: roboshop-mysql
    initContainers:
      - name: secret-reader
        image: amazon/aws-cli
        command:
        - sh
        - c
        - |
            aws secretsmanager get-secret-value \
            --secret-id RoboshopMySQLAsecrectRead \
            --region us-east-1 \
            --query SecretString \  
            --output text
            {"RoboshopMySQLsecretRead":""} >/secrets/mysql-secret.txt
            echo "Secret fetched successfully"
            cat /secrets/mysql-secret.txt # just for testing, we should not do this
        volumeMounts:
        - name: mysql-secret
          mountPath: /secrets
    containers:
      - name: mysql
        image: manigangisetty/mysql:1.0
        args: ["--mysql-native-password=ON"]
        volumeMounts:
        - name: mysql-Secret
          mountPath: /data
    volumes:
      - name: mysql-Secret
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: roboshop
  # servicer labels
  labels:
    project: roboshop
    tier: db
    component: mysql
spec:
  # Service uses the below labels to select the pods
  selector:
    project: roboshop
    tier: db
    component: mysql
  ports:
    - protocol: TCP
      port: 3306 # service port
      targetPort: 3306  # container port